services:
  app:
    build: .
    image: finance-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - finance-data:/data
    labels:
      # Adds a "WebUI" entry to the container's menu in Unraid's Docker tab.
      net.unraid.docker.webui: "http://[IP]:[PORT:8000]/"

volumes:
  finance-data:
