<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Finance</title>
  <link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>
<div class="login-wrap">
  <h1 style="margin-bottom:20px">Finance</h1>
  <form method="post" action="/login" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <div class="field"><label for="u">Username</label><input id="u" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="primary" type="submit" style="width:100%">Sign in</button>
  </form>
</div>
</body>
</html>
